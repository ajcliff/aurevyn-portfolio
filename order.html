<section style="max-width:700px;margin:auto;">

<h2 class="section-title">Order Your Burger</h2>

<form>

<label>Name</label> <input type="text" placeholder="Your name">

<label>Phone Number</label> <input type="tel" placeholder="Your phone number">

<label>Select Burger</label>

<select>
<option>Classic Cheeseburger</option>
<option>BBQ Bacon Burger</option>
<option>Grilled Chicken Burger</option>
<option>Veggie Burger</option>
</select>

<label>Quantity</label> <input type="number" value="1">

<label>Delivery Address</label>

<textarea rows="4"></textarea>

<button class="btn">Place Order</button>

</form>

</section>
