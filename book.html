<!DOCTYPE html>

<html>

<head>

<title>Book Your Adventure</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:Arial;
background:#0b1f3b;
color:white;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
background:#06101f;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
}

section{
padding:60px 20px;
max-width:700px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:40px;
}

form{
display:flex;
flex-direction:column;
}

input, select, textarea{
margin-bottom:15px;
padding:12px;
border-radius:6px;
border:none;
}

button{
background:gold;
color:black;
padding:12px;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

</style>

</head>

<body>

<header>

<h2>Explore Africa</h2>

<nav>
<a href="exploreafrica.html">Home</a>
<a href="destinations.html">Destinations</a>
<a href="packages.html">Packages</a>
<a href="book.html">Book Trip</a>
</nav>

</header>

<section>

<h1>Book Your Adventure</h1>

<form>

<label>Destination</label>

<select>
<option>Maasai Mara Safari</option>
<option>Zanzibar Beach Holiday</option>
<option>Mount Kilimanjaro Trek</option>
<option>Serengeti Wildlife Tour</option>
</select>

<label>Travel Date</label>

<input type="date">

<label>Number of Travelers</label>

<input type="number" placeholder="Enter number of travelers">

<label>Your Name</label>

<input type="text" placeholder="Full name">

<label>Email</label>

<input type="email" placeholder="Email address">

<label>Additional Notes</label>

<textarea rows="4" placeholder="Special requests or questions"></textarea>

<button>Submit Booking Request</button>

</form>

</section>

</body>

</html>
